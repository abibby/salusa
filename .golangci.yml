version: "2"
linters:
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - staticcheck
        text: "SA1029: should not use built-in type string as key for value; define your own type to avoid collisions"

      - linters:
          - errcheck
        text: "is not checked"

      - linters:
          - unused
        text: "is unused"

      - linters:
          - staticcheck
        text: 'could remove embedded field "EmbeddedHook" from selector'
